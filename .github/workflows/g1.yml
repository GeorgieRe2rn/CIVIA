name: G1 datos ML y contrato
on:
  pull_request:
    branches: [develop]
  push:
    branches: [etapa/01-datos-ml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m civia_data.verify
      - run: python -m pytest -q
