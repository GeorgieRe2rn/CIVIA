                                  "territory_id": {
                                    "type": "string"
                                  }
                                },
                                "required": [
                                  "territory_id"
                                ]
                              }
                            },
                            "required": [
                              "type",
                              "geometry",
                              "properties"
                            ]
                          }
                        }
                      },
