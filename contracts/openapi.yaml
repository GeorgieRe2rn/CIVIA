  "components": {
    "schemas": {
      "Meta": {
        "type": "object",
        "properties": {
          "source_version": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "data_status": {
            "type": "string",
            "enum": [
              "observado",
              "predicho",
              "simulado",
              "no_aplica"
            ]
          }
        },
        "required": [
          "source_version",
          "timestamp",
          "data_status"
        ]
      },
      "Source": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "url": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string"
          },
          "retrieved_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "url",
          "title",
          "retrieved_at"
        ]
      },
      "Territory": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "level": {
            "type": "string",
            "enum": [
              "estado",
              "municipio",
              "seccion"
            ]
          }
        },
        "required": [
          "id",
          "name",
          "level"
        ]
      },
      "Observation": {
        "type": "object",
        "properties": {
          "election_id": {
            "type": "string"
          },
          "year": {
            "type": "integer"
          },
          "participation_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "abstention_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "source_id": {
            "type": "string"
          }
        },
        "required": [
          "election_id",
          "year",
          "participation_pct",
          "abstention_pct",
          "source_id"
        ]
      },
      "PredictionRequest": {
        "type": "object",
        "properties": {
          "territory_id": {
            "type": "string"
          },
          "election_id": {
            "type": "string"
          }
        },
        "required": [
          "territory_id",
          "election_id"
        ]
      },
      "ScenarioRequest": {
        "type": "object",
        "properties": {
          "territory_id": {
            "type": "string"
          },
          "election_id": {
            "type": "string"
          },
          "delta_pp": {
            "type": "number",
            "minimum": -20,
            "maximum": 20
          }
        },
        "required": [
          "territory_id",
          "election_id",
          "delta_pp"
        ]
      },
      "AssistantRequest": {
        "type": "object",
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          },
          "territory_id": {
            "type": "string"
          }
        },
        "required": [
          "question",
          "territory_id"
        ]
      },
      "Prediction": {
        "type": "object",
        "properties": {
          "abstention_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "model_version": {
            "type": "string"
          },
          "mae_pp": {
            "type": "number",
            "minimum": 0
          },
          "baseline_mae_pp": {
            "type": "number",
            "minimum": 0
          },
          "n_test": {
            "type": "integer",
            "minimum": 1
          },
          "interval": {
            "type": "object",
            "properties": {
              "lower": {
                "type": "number",
                "minimum": 0,
                "maximum": 100
              },
              "upper": {
                "type": "number",
                "minimum": 0,
                "maximum": 100
              },
              "level": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              "empirical_coverage": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              }
            },
            "required": [
              "lower",
              "upper",
              "level",
              "empirical_coverage"
            ],
            "nullable": true
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "abstention_pct",
          "model_version",
          "mae_pp",
          "baseline_mae_pp",
          "n_test",
          "interval",
          "warnings"
        ]
      },
      "Scenario": {
        "type": "object",
        "properties": {
          "base_participation_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "final_participation_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "final_abstention_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "delta_pp": {
            "type": "number"
          },
          "clamped": {
            "type": "boolean"
          },
          "label": {
            "type": "string",
            "enum": [
              "Simulación hipotética"
            ]
          }
        },
        "required": [
          "base_participation_pct",
          "final_participation_pct",
          "final_abstention_pct",
          "delta_pp",
          "clamped",
          "label"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "meta": {
            "$ref": "#/components/schemas/Meta"
          },
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "meta",
          "error"
        ]
      }
    }
  }
}