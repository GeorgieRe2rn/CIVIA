  "components": {
    "schemas": {
      "Meta": {
        "type": "object",
        "properties": {
          "source_version": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "data_status": {
            "type": "string",
            "enum": [
              "observado",
              "predicho",
              "simulado",
              "no_aplica"
            ]
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "source_version",
          "timestamp",
          "data_status",
          "warnings"
        ]
      },
      "Source": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "url": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string"
          },
          "retrieved_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "url",
          "title",
          "retrieved_at"
        ]
      },
      "Territory": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^14[0-9]{3}$",
            "description": "INE EDOCVE (2) + MPIOCVE (3). No asumir clave INEGI."
          },
          "name": {
            "type": "string"
          },
          "level": {
            "type": "string",
            "enum": [
              "municipio"
            ]
          },
          "state_id": {
            "type": "string",
            "enum": [
              "14"
            ]
          },
          "code_system": {
            "type": "string",
            "enum": [
              "INE_EDOCVE_MPIOCVE"
            ]
          }
        },
        "required": [
          "id",
          "name",
          "level",
          "state_id",
          "code_system"
        ]
      },
      "Observation": {
        "type": "object",
        "properties": {
          "election_id": {
            "type": "string"
          },
          "year": {
            "type": "integer"
          },
          "participation_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "description": "100*SV/(SV+NV); no representa SV/LN. NS se presenta separado."
          },
          "abstention_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "source_id": {
            "type": "string"
          },
          "territory_id": {
            "type": "string"
          },
          "election_date": {
            "type": "string",
            "format": "date"
          },
          "election_type": {
            "type": "string",
            "enum": [
              "federal_concurrente",
              "federal_intermedia"
            ]
          },
          "nominal_count": {
            "type": "integer",
            "minimum": 0
          },
          "voted_count": {
            "type": "integer",
            "minimum": 0
          },
          "not_voted_count": {
            "type": "integer",
            "minimum": 0
          },
          "unknown_count": {
            "type": "integer",
            "minimum": 0
          },
          "known_count": {
            "type": "integer",
            "minimum": 0
          },
          "unknown_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "description": "100*(SV+NS)/LN: extremo aritmético por faltantes, NO intervalo estadístico."
          },
          "participation_lower_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "description": "100*(SV+NS)/LN: extremo aritmético por faltantes, NO intervalo estadístico."
          },
          "participation_upper_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100,
            "description": "100*(SV+NS)/LN: extremo aritmético por faltantes, NO intervalo estadístico."
          },
          "denominator": {
            "type": "string",
            "enum": [
              "SV+NV"
            ]
          }
        },
        "required": [
          "election_id",
          "year",
          "participation_pct",
          "abstention_pct",
          "source_id",
          "territory_id",
          "election_date",
          "election_type",
          "nominal_count",
          "voted_count",
          "not_voted_count",
          "unknown_count",
          "known_count",
          "unknown_pct",
          "participation_lower_pct",
          "participation_upper_pct",
          "denominator"
        ]
      },
      "PredictionRequest": {
        "type": "object",
        "properties": {
          "territory_id": {
            "type": "string",
            "pattern": "^14[0-9]{3}$"
          },
          "election_id": {
            "type": "string",
            "enum": [
              "federal-2024"
            ],
            "description": "Solo backtest 2024; otros objetivos requieren nuevo artefacto y validación."
          }
        },
        "required": [
          "territory_id",
          "election_id"
        ],
        "additionalProperties": false
      },
      "ScenarioRequest": {
        "type": "object",
        "properties": {
          "territory_id": {
            "type": "string",
            "pattern": "^14[0-9]{3}$"
          },
          "election_id": {
            "type": "string",
            "enum": [
              "federal-2024"
            ],
            "description": "Solo backtest 2024; otros objetivos requieren nuevo artefacto y validación."
          },
          "delta_pp": {
            "type": "number",
            "minimum": -20,
            "maximum": 20
          }
        },
        "required": [
          "territory_id",
          "election_id",
          "delta_pp"
        ],
        "additionalProperties": false
      },
      "AssistantRequest": {
        "type": "object",
        "properties": {
          "question": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          },
          "territory_id": {
            "type": "string"
          }
        },
        "required": [
          "question",
          "territory_id"
        ]
      },
      "Prediction": {
        "type": "object",
        "properties": {
          "abstention_pct": {
            "type": "number",
            "minimum": 0,
            "maximum": 100
          },
          "model_version": {
            "type": "string"
          },
          "mae_pp": {
            "type": "number",
            "minimum": 0
          },
          "baseline_mae_pp": {
            "type": "number",
            "minimum": 0
          },
          "n_test": {
            "type": "integer",
            "minimum": 1
          },
          "interval": {
            "type": "object",
            "properties": {
              "lower": {
                "type": "number",
                "minimum": 0,
                "maximum": 100
              },
              "upper": {
                "type": "number",
                "minimum": 0,
                "maximum": 100
              },
              "level": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              "empirical_coverage": {
