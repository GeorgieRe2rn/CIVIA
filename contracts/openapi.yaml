  "openapi": "3.0.3",
  "info": {
    "title": "CIVIA API - contrato G1",
    "version": "1.1.0",
    "description": "Contrato G1 para revisión de Lluvia. Cobertura Jalisco/municipios INE; CCPC 2009-2024; tasas entre condición conocida SV+NV, NS separado. Predicción: backtest 2024, no pronóstico futuro. API aún no implementada."
  },
